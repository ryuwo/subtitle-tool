<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자막 오역 수정 도구</title>
    
    <!-- CORS 정책 설정 -->
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
    <header>
        <div class="header-content">
            <img src="logo.png" alt="회사 로고" class="company-logo">
            <h1>FixSub</h1>
        </div>
        <p>Google Sheets 기반 오역 수정 시스템</p>
    </header>

        <main>
        
            <section class="connection-section">
                <h2>🔸 Google Sheets 연결</h2>
                <div class="language-cards">
                    <div class="lang-card lang-card-jp">
                        <span class="lang-flag">🇯🇵</span>
                        <span class="lang-name">일본어</span>
                        <div class="lang-card-actions">
                            <a href="https://docs.google.com/spreadsheets/d/12JXctT0dK7wJ4J_NUAZfTpwQHs7tp_Ue--av4boIY7s" target="_blank" class="btn-link">🔗 시트 열기</a>
                            <button onclick="connectToLanguageSheet('japanese')" class="btn-fetch">📥 시트 데이터 가져오기</button>
                        </div>
                    </div>
                    <div class="lang-card lang-card-cn">
                        <span class="lang-flag">🇨🇳</span>
                        <span class="lang-name">중국어</span>
                        <div class="lang-card-actions">
                            <a href="https://docs.google.com/spreadsheets/d/1QYvxyjlH_hoW8eM2v3dYaKQwfZ-kX-Oeqx7u12CgmBs" target="_blank" class="btn-link">🔗 시트 열기</a>
                            <button onclick="connectToLanguageSheet('chinese')" class="btn-fetch">📥 시트 데이터 가져오기</button>
                        </div>
                    </div>
                    <div class="lang-card lang-card-en">
                        <span class="lang-flag">🇺🇸</span>
                        <span class="lang-name">영어</span>
                        <div class="lang-card-actions">
                            <a href="https://docs.google.com/spreadsheets/d/1YHINIMQDnHkLMYIadx_bgR7RY8j1ZzRegxsE8dl8nNQ" target="_blank" class="btn-link">🔗 시트 열기</a>
                            <button onclick="connectToLanguageSheet('english')" class="btn-fetch">📥 시트 데이터 가져오기</button>
                        </div>
                    </div>
                    <div class="lang-card lang-card-official">
                        <span class="lang-flag">📖</span>
                        <span class="lang-name">PLAVE 공식 단어장</span>
                        <div class="lang-card-actions">
                            <a href="https://docs.google.com/spreadsheets/d/1e56iXVRR_-VvoBQqUXpitlyeQB4_ueHv/edit?usp=sharing&ouid=107399147738542335695&rtpof=true&sd=true" target="_blank" class="btn-link">🔗 시트 열기</a>
                        </div>
                    </div>
                </div>
                <div id="connection-status" class="status"></div>
            </section>

            <section class="dictionary-section">
                <h2>🔸 오역 사전 현황</h2>
                <div class="dict-info">
                    <span>현재 등록된 오역 항목: <strong id="dict-count">0</strong>개</span>
                    <button onclick="refreshDictionary()">새로고침</button>
                </div>
                <div id="dict-preview" class="dict-preview"></div>
            </section>

            <section class="process-section">
    <h2>🔸 자막 오표기 수정</h2>
    <div class="file-upload">
        <input type="file" id="subtitle-file" accept=".srt,.vtt">
        <button onclick="processFile()">검사 시작</button>
    </div>

    <div id="diff-summary" class="diff-summary" hidden>
        <div class="diff-summary-text">
            <span class="diff-count" id="diff-count">0</span>
            <span>건의 오표기가 수정되었습니다</span>
        </div>
        <button onclick="downloadResult()" class="btn-primary">⬇ 수정본 다운로드</button>
    </div>

    <div id="diff-list" class="diff-list" aria-live="polite">
        <p class="diff-empty">자막 파일을 업로드하면 수정된 항목이 여기에 표시됩니다.</p>
    </div>

    <!-- 전체 수정된 자막 저장용 (숨겨진 요소) -->
    <textarea id="full-corrected-subtitle" hidden></textarea>
    <textarea id="original-subtitle" hidden></textarea>
</section>

    <section class="validation-section">
        <h2>🔸 Segment 검수</h2>
        <div class="validation-upload">
            <input type="file" id="validation-file" accept=".srt,.vtt">
            <button onclick="validateFile()">검사 시작</button>
        </div>

        <div id="validation-summary" class="validation-summary" hidden>
            <span id="validation-total"></span>
            <button onclick="downloadValidationResult()" class="btn-primary" id="validation-download-btn" hidden>⬇ 수정본 다운로드</button>
        </div>

        <div id="validation-tabs" class="validation-tabs" hidden>
            <button class="validation-tab active" data-tab="korean" onclick="switchValidationTab('korean')">
                🇰🇷 한국어 검출 <span class="validation-tab-count" id="tab-count-korean">0</span>
            </button>
            <button class="validation-tab" data-tab="segment" onclick="switchValidationTab('segment')">
                📊 세그먼트 번호 <span class="validation-tab-count" id="tab-count-segment">0</span>
            </button>
            <button class="validation-tab" data-tab="auto" onclick="switchValidationTab('auto')">
                🛠 기타 오류 수정 <span class="validation-tab-count" id="tab-count-auto">0</span>
            </button>
        </div>

        <div id="validation-list" class="validation-list">
            <p class="diff-empty">자막 파일을 업로드하면 한국어 검출, 세그먼트 번호, 기타 오류가 탭별로 표시됩니다.</p>
        </div>

        <textarea id="validation-corrected-subtitle" hidden></textarea>
    </section>

        </main>
    </div>

    <!-- Google API를 동적으로 로드 -->
    <script src="config.js"></script>
    <script>
        // Google API 동적 로딩
        function loadGoogleAPI() {
            const script = document.createElement('script');
            script.src = 'https://apis.google.com/js/api.js';
            script.onload = function() {
                initializeGoogleAPI();
            };
            script.onerror = function() {
                console.error('Google API 로드 실패');
                updateConnectionStatus('Google API 로드 실패', 'error');
            };
            document.head.appendChild(script);
        }
        
        // 페이지 로드 완료 후 API 로드
        window.addEventListener('load', loadGoogleAPI);
    </script>
    <script src="subtitle-processor.js"></script>
</body>
</html>
